# The probes, seed scripts and research tools beside the docs. CI lints them for bugs, so ruff's style and idiom
# families stay off.

[lint]
ignore = [
  "UP",   # syntax upgrades: printf-style formats, none of them wrong
  "I",    # import order
  "SIM",  # rewrites; SIM115's bare open() is in scripts that exit right after
  "PIE",  # idiom rewrites
  "FURB", # idiom rewrites
  "PLC",  # idiom rewrites
  "RUF007", # idiom: itertools.pairwise over zip
]

